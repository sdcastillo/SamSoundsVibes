<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="keywords" content="artificial intelligence, superintelligence, SI">
</head>
<body>
<style>
#google_translate_element{position:fixed;bottom:12px;right:12px;z-index:1000;font-size:13px;line-height:1.2;max-width:240px}
@media (max-width:600px){#google_translate_element{bottom:8px;right:8px;font-size:11px;max-width:160px;transform:scale(0.85);transform-origin:bottom right}}
</style>
<div id="google_translate_element"></div>
<script>
function googleTranslateElementInit() {
  new google.translate.TranslateElement({pageLanguage:'en', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
}
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
